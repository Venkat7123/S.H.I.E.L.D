# S.H.I.E.L.D runtime configuration.
# Secrets never live here - see .env.example.

llm:
  mode: stub              # stub | live
  provider: groq          # one of: groq | openrouter | gemini | nvidia | bedrock
  model: "llama-3.3-70b-versatile"   # verify against the provider's docs before a live run
  timeout_seconds: 30
  max_tokens: 1024

paths:
  policy_file: policy/policy.yaml
  database: data/shield.db
  audit_jsonl: logs/audit.jsonl

run:
  # Hard ceiling on worker iterations, independent of the policy budget.
  # Defence in depth: a looping agent stops even if budget accounting breaks.
  max_worker_iterations: 20
  tool_timeout_seconds: 5
  tool_max_retries: 3
  retry_backoff_seconds: [1, 2, 4]
